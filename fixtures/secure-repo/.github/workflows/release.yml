name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@8ade135a41bc03ea155e62e844d188df1ea18608
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@e953d5da4f1e8ab957d8d64c5b32a5ae2f7f6d3d
