[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-firebreak"
version = "0.1.0"
description = "Detect and explain CI/CD and package-publish supply chain risks in GitHub repositories."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Sameer Alam", email = "113900807+Crynge@users.noreply.github.com" }
]
dependencies = [
  "PyYAML>=6.0.2,<7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "playwright>=1.55,<2.0",
]

[project.scripts]
firebreak = "firebreak.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
